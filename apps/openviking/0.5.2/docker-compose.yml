services:
  openviking:
    image: ghcr.io/volcengine/openviking:v0.5.2
    # Mainland China mirror (uncomment if ghcr.io is slow/unreachable):
    # image: openviking-cn-beijing.cr.volces.com/volcengine/openviking:v0.5.2
    container_name: ${CONTAINER_NAME}
    restart: always
    # Writes ov.conf on first start only (preset + overrides), then defers to the
    # official entrypoint. Later edits belong in data/ov.conf or Web Studio.
    entrypoint: ["python3", "/opt/1panel/init-config.py"]
    ports:
      - "${PANEL_APP_PORT_HTTP}:1933"
    volumes:
      - ./data:/app/.openviking
      - ./data/scripts/init-config.py:/opt/1panel/init-config.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The bundled VikingBot is disabled by default: in API-key mode it needs a
      # User/Admin key (a root key cannot be used). See the README to enable it.
      OPENVIKING_WITH_BOT: "0"
      OPENVIKING_SERVER_HOST: "0.0.0.0"
      OPENVIKING_SERVER_PORT: "1933"
      OPENVIKING_CONFIG_FILE: /app/.openviking/ov.conf
      ROOT_API_KEY: ${ROOT_API_KEY}
      MODEL_PRESET: ${MODEL_PRESET}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_API_BASE: ${MODEL_API_BASE}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      VLM_MODEL: ${VLM_MODEL}
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true

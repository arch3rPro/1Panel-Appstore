additionalProperties:
  formFields:
    - default: 1933
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      required: true
      rule: paramPort
      type: number
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 埠
        ja: HTTP ポート
        ko: HTTP 포트
    - default: ""
      edit: true
      envKey: ROOT_API_KEY
      labelEn: Root API Key (also the Studio login password)
      labelZh: root 密钥（也是 Studio 登录密码）
      random: true
      required: true
      type: password
      label:
        en: Root API Key (also the Studio login password)
        zh: root 密钥（也是 Studio 登录密码）
        zh-Hant: root 金鑰（也是 Studio 登入密碼）
        ja: root キー（Studio のログインパスワードにもなる）
        ko: root 키 (Studio 로그인 비밀번호로도 사용)
    - default: openai
      edit: true
      envKey: MODEL_PRESET
      labelEn: Model Preset
      labelZh: 模型预设
      required: true
      type: select
      values:
        - label: OpenAI（含兼容代理）
          value: openai
        - label: 火山方舟 / Doubao
          value: volcengine
        - label: Ollama 本地模型
          value: ollama
        - label: 自定义（OpenAI 兼容）
          value: custom
      label:
        en: Model Preset
        zh: 模型预设
        zh-Hant: 模型預設
        ja: モデルプリセット
        ko: 모델 프리셋
    - default: ""
      edit: true
      envKey: MODEL_API_KEY
      labelEn: Model API Key (required, not needed for Ollama)
      labelZh: 模型 API 密钥（必填，选 Ollama 不需要）
      required: false
      type: password
      label:
        en: Model API Key (required, not needed for Ollama)
        zh: 模型 API 密钥（必填，选 Ollama 不需要）
        zh-Hant: 模型 API 金鑰（必填，選 Ollama 不需要）
        ja: モデル API キー（必須、Ollama 選択時は不要）
        ko: 모델 API 키 (필수, Ollama 선택 시 불필요)
    - default: ""
      edit: true
      envKey: MODEL_API_BASE
      labelEn: Advanced - override API base URL (custom preset only)
      labelZh: 高级 - 覆写模型 API 地址（仅自定义预设）
      required: false
      type: text
      label:
        en: Advanced - override API base URL (custom preset only)
        zh: 高级 - 覆写模型 API 地址（仅自定义预设）
        zh-Hant: 進階 - 覆寫模型 API 位址（僅自訂預設）
        ja: 詳細 - モデル API ベース URL を上書き（カスタムプリセットのみ）
        ko: 고급 - 모델 API 기본 URL 재정의 (사용자 정의 프리셋만)
    - default: ""
      edit: true
      envKey: EMBEDDING_MODEL
      labelEn: Advanced - override embedding model (custom preset only)
      labelZh: 高级 - 覆写向量嵌入模型（仅自定义预设）
      required: false
      type: text
      label:
        en: Advanced - override embedding model (custom preset only)
        zh: 高级 - 覆写向量嵌入模型（仅自定义预设）
        zh-Hant: 進階 - 覆寫向量嵌入模型（僅自訂預設）
        ja: 詳細 - 埋め込みモデルを上書き（カスタムプリセットのみ）
        ko: 고급 - 임베딩 모델 재정의 (사용자 정의 프리셋만)
    - default: ""
      edit: true
      envKey: EMBEDDING_DIMENSION
      labelEn: Advanced - override embedding dimension (custom preset only)
      labelZh: 高级 - 覆写向量维度（仅自定义预设）
      required: false
      type: text
      label:
        en: Advanced - override embedding dimension (custom preset only)
        zh: 高级 - 覆写向量维度（仅自定义预设）
        zh-Hant: 進階 - 覆寫向量維度（僅自訂預設）
        ja: 詳細 - 埋め込み次元数を上書き（カスタムプリセットのみ）
        ko: 고급 - 임베딩 차원 재정의 (사용자 정의 프리셋만)
    - default: ""
      edit: true
      envKey: VLM_MODEL
      labelEn: Advanced - override VLM model (custom preset only)
      labelZh: 高级 - 覆写视觉语言模型 (VLM)（仅自定义预设）
      required: false
      type: text
      label:
        en: Advanced - override VLM model (custom preset only)
        zh: 高级 - 覆写视觉语言模型 (VLM)（仅自定义预设）
        zh-Hant: 進階 - 覆寫視覺語言模型 (VLM)（僅自訂預設）
        ja: 詳細 - VLM モデルを上書き（カスタムプリセットのみ）
        ko: 고급 - VLM 모델 재정의 (사용자 정의 프리셋만)

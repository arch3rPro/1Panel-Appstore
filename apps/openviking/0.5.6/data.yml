additionalProperties:
  formFields:
    - default: 1933
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Host Port
      labelZh: HTTP 访问端口
      required: true
      type: number
      label:
        en: HTTP Host Port
        zh: HTTP 访问端口
        zh-hant: HTTP 存取連接埠
        ja: HTTP アクセスポート
        ko: HTTP 접속 포트
      description:
        zh: 服务访问端口，默认 1933。
        en: Service access port, 1933 by default.
      rule: paramPort
    - default: ''
      edit: false
      envKey: ROOT_API_KEY
      labelEn: System Management API Key (Root)
      labelZh: 系统管理 API Key（Root）
      required: true
      type: password
      label:
        en: System Management API Key (Root)
        zh: 系统管理 API Key（Root）
        zh-hant: 系統管理 API Key（Root）
        ja: システム管理 API キー（Root）
        ko: 시스템 관리 API 키 (Root)
      description:
        zh: 填写用于管理 OpenViking 的 API Key。
        en: Enter the API key used to manage OpenViking.
    - default: ''
      edit: false
      envKey: EMBEDDING_PROVIDER
      labelEn: Embedding Provider
      labelZh: Embedding 接口类型
      required: false
      type: select
      label:
        en: Embedding Provider
        zh: Embedding 接口类型
        zh-hant: Embedding 介面類型
        ja: Embedding プロバイダー
        ko: Embedding 제공자
      description:
        zh: 选择向量模型的接口类型；暂不配置请整组留空。
        en: Select the embedding API type, or leave the whole group empty for later.
      values:
        - label: 未配置 / Configure later
          value: ''
        - label: OpenAI 兼容 / OpenAI-compatible
          value: openai
        - label: 火山方舟 / Volcengine Ark
          value: volcengine
        - label: Ollama Embedding（OpenAI /v1）
          value: ollama
    - default: ''
      edit: false
      envKey: EMBEDDING_API_BASE
      labelEn: Embedding API Base
      labelZh: Embedding API 地址
      required: false
      type: text
      label:
        en: Embedding API Base
        zh: Embedding API 地址
        zh-hant: Embedding API 位址
        ja: Embedding API ベース URL
        ko: Embedding API 기본 URL
      description:
        zh: 填写自定义 API 地址；使用官方服务或宿主机 Ollama 可留空。
        en: Enter a custom API base, or leave blank for the official service or host Ollama.
    - default: ''
      edit: false
      envKey: EMBEDDING_API_KEY
      labelEn: Embedding Service API Key
      labelZh: Embedding 服务 API Key
      required: false
      type: password
      label:
        en: Embedding Service API Key
        zh: Embedding 服务 API Key
        zh-hant: Embedding 服務 API Key
        ja: Embedding サービス API キー
        ko: Embedding 서비스 API 키
      description:
        zh: 填写向量模型服务的 API Key；无需鉴权时可留空。
        en: Enter the embedding service API key, or leave blank if authentication is not required.
    - default: ''
      edit: false
      envKey: EMBEDDING_MODEL
      labelEn: Embedding Model
      labelZh: Embedding 模型名
      required: false
      type: text
      label:
        en: Embedding Model
        zh: Embedding 模型名
        zh-hant: Embedding 模型名稱
        ja: Embedding モデル名
        ko: Embedding 모델명
      description:
        zh: 填写服务提供的向量模型名称。
        en: Enter the embedding model name provided by the service.
    - default: ''
      edit: false
      envKey: EMBEDDING_DIMENSION
      labelEn: Embedding Output Dimension
      labelZh: Embedding 输出维度
      required: false
      type: text
      label:
        en: Embedding Output Dimension
        zh: Embedding 输出维度
        zh-hant: Embedding 輸出維度
        ja: Embedding 出力次元数
        ko: Embedding 출력 차원
      description:
        zh: 填写模型文档标明的向量维度。
        en: Enter the vector dimension specified in the model documentation.
    - default: ''
      edit: false
      envKey: EMBEDDING_INPUT
      labelEn: Embedding Input Type
      labelZh: Embedding 输入类型
      required: false
      type: select
      label:
        en: Embedding Input Type
        zh: Embedding 输入类型
        zh-hant: Embedding 輸入類型
        ja: Embedding 入力タイプ
        ko: Embedding 입력 유형
      description:
        zh: 默认文本；多模态模型可选 multimodal。
        en: Text by default, or multimodal for a multimodal model.
      values:
        - label: 未设置（组启用后 text） / Unset (text when configured)
          value: ''
        - label: 文本 / Text
          value: text
        - label: 多模态 / Multimodal
          value: multimodal
    - default: ''
      edit: false
      envKey: VLM_PROVIDER
      labelEn: VLM Provider (Summary / Chat / Vision)
      labelZh: VLM 接口类型（摘要/对话/视觉）
      required: false
      type: select
      label:
        en: VLM Provider (Summary / Chat / Vision)
        zh: VLM 接口类型（摘要/对话/视觉）
        zh-hant: VLM 介面類型（摘要/對話/視覺）
        ja: VLM プロバイダー（要約/会話/視覚）
        ko: VLM 제공자 (요약/대화/시각)
      description:
        zh: 选择摘要、对话或视觉模型的接口类型。
        en: Select the API type for the summary, chat or vision model.
      values:
        - label: 未配置 / Configure later
          value: ''
        - label: OpenAI 兼容 / OpenAI-compatible
          value: openai
        - label: 火山方舟 / Volcengine Ark
          value: volcengine
    - default: ''
      edit: false
      envKey: VLM_API_BASE
      labelEn: VLM API Base
      labelZh: VLM API 地址
      required: false
      type: text
      label:
        en: VLM API Base
        zh: VLM API 地址
        zh-hant: VLM API 位址
        ja: VLM API ベース URL
        ko: VLM API 기본 URL
      description:
        zh: 填写自定义 API 地址；使用官方服务可留空。
        en: Enter a custom API base, or leave blank for the official service.
    - default: ''
      edit: false
      envKey: VLM_API_KEY
      labelEn: VLM Service API Key
      labelZh: VLM 服务 API Key
      required: false
      type: password
      label:
        en: VLM Service API Key
        zh: VLM 服务 API Key
        zh-hant: VLM 服務 API Key
        ja: VLM サービス API キー
        ko: VLM 서비스 API 키
      description:
        zh: 填写此模型服务的 API Key；无需鉴权时可留空。
        en: Enter this model service's API key, or leave blank if authentication is not required.
    - default: ''
      edit: false
      envKey: VLM_MODEL
      labelEn: VLM Chat / Vision Model
      labelZh: VLM 模型名（摘要/对话/视觉）
      required: false
      type: text
      label:
        en: VLM Chat / Vision Model
        zh: VLM 模型名（摘要/对话/视觉）
        zh-hant: VLM 模型名稱（摘要/對話/視覺）
        ja: VLM モデル名（要約/会話/視覚）
        ko: VLM 모델명 (요약/대화/시각)
      description:
        zh: 填写服务提供的摘要、对话或视觉模型名称。
        en: Enter the summary, chat or vision model name provided by the service.

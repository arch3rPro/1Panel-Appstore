additionalProperties:
  formFields:
    - default: 1933
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      required: true
      rule: paramPort
      type: number
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 埠
        ja: HTTP ポート
        ko: HTTP 포트
    - default: ""
      edit: true
      envKey: ROOT_API_KEY
      labelEn: Root API Key
      labelZh: root 密钥
      random: true
      required: true
      type: password
      label:
        en: Root API Key
        zh: root 密钥
        zh-Hant: root 金鑰
        ja: root キー
        ko: root 키
    - default: openai
      edit: true
      envKey: MODEL_PRESET
      labelEn: Model Preset
      labelZh: 模型预设
      required: true
      type: select
      values:
        - label: OpenAI（含兼容代理）
          value: openai
        - label: 火山方舟 / Doubao
          value: volcengine
        - label: Ollama 本地模型
          value: ollama
        - label: 自定义（OpenAI 兼容）
          value: custom
      label:
        en: Model Preset
        zh: 模型预设
        zh-Hant: 模型預設
        ja: モデルプリセット
        ko: 모델 프리셋
    - default: ""
      edit: true
      envKey: MODEL_API_KEY
      labelEn: Model API Key (empty = configure later in Studio)
      labelZh: 模型 API 密钥（留空表示稍后在 Web Studio 配置）
      required: false
      type: password
      label:
        en: Model API Key (empty = configure later in Studio)
        zh: 模型 API 密钥（留空表示稍后在 Web Studio 配置）
        zh-Hant: 模型 API 金鑰（留空表示稍後於 Web Studio 設定）
        ja: モデル API キー（空欄なら後で Studio で設定）
        ko: 모델 API 키 (비워두면 나중에 Studio에서 설정)
    - default: ""
      edit: true
      envKey: MODEL_API_BASE
      labelEn: Advanced - override API base URL
      labelZh: 高级 - 覆写模型 API 地址
      required: false
      type: text
      label:
        en: Advanced - override API base URL
        zh: 高级 - 覆写模型 API 地址
        zh-Hant: 進階 - 覆寫模型 API 位址
        ja: 詳細 - モデル API ベース URL を上書き
        ko: 고급 - 모델 API 기본 URL 재정의
    - default: ""
      edit: true
      envKey: EMBEDDING_MODEL
      labelEn: Advanced - override embedding model
      labelZh: 高级 - 覆写向量嵌入模型
      required: false
      type: text
      label:
        en: Advanced - override embedding model
        zh: 高级 - 覆写向量嵌入模型
        zh-Hant: 進階 - 覆寫向量嵌入模型
        ja: 詳細 - 埋め込みモデルを上書き
        ko: 고급 - 임베딩 모델 재정의
    - default: ""
      edit: true
      envKey: EMBEDDING_DIMENSION
      labelEn: Advanced - override embedding dimension
      labelZh: 高级 - 覆写向量维度
      required: false
      type: text
      label:
        en: Advanced - override embedding dimension
        zh: 高级 - 覆写向量维度
        zh-Hant: 進階 - 覆寫向量維度
        ja: 詳細 - 埋め込み次元数を上書き
        ko: 고급 - 임베딩 차원 재정의
    - default: ""
      edit: true
      envKey: VLM_MODEL
      labelEn: Advanced - override VLM model
      labelZh: 高级 - 覆写视觉语言模型 (VLM)
      required: false
      type: text
      label:
        en: Advanced - override VLM model
        zh: 高级 - 覆写视觉语言模型 (VLM)
        zh-Hant: 進階 - 覆寫視覺語言模型 (VLM)
        ja: 詳細 - VLM モデルを上書き
        ko: 고급 - VLM 모델 재정의

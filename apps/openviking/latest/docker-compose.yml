services:
  openviking:
    image: ghcr.io/volcengine/openviking:latest
    # Mainland China mirror (uncomment if ghcr.io is slow/unreachable):
    # image: openviking-cn-beijing.cr.volces.com/volcengine/openviking:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    # Create ov.conf once from independent model groups, then use upstream's
    # entrypoint. Existing files are never overwritten. Empty model groups are
    # omitted; upstream defaults and runtime limitations still apply (see README).
    entrypoint: ["python3", "/opt/1panel/init-config.py"]
    ports:
      - "${PANEL_APP_PORT_HTTP}:1933"
    volumes:
      - ./data:/app/.openviking
      - ./data/scripts/init-config.py:/opt/1panel/init-config.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Bot requires a separate User/Admin data-access key when enabled.
      OPENVIKING_WITH_BOT: "0"
      OPENVIKING_SERVER_HOST: "0.0.0.0"
      OPENVIKING_SERVER_PORT: "1933"
      OPENVIKING_CONFIG_FILE: /app/.openviking/ov.conf
      ROOT_API_KEY: ${ROOT_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-}
      EMBEDDING_INPUT: ${EMBEDDING_INPUT:-}
      VLM_PROVIDER: ${VLM_PROVIDER:-}
      VLM_API_BASE: ${VLM_API_BASE:-}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_MODEL: ${VLM_MODEL:-}
      # Migration detection only, not shared model settings. Existing ov.conf
      # wins; without a file, legacy-only installs get a migration error.
      MODEL_PRESET: ${MODEL_PRESET:-}
      MODEL_API_BASE: ${MODEL_API_BASE:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true

# Based on lobehub/lobehub v2.3.4 docker-compose/deploy.
services:
  lobe:
    image: lobehub/lobehub:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - '${PANEL_APP_PORT_HTTP}:3210'
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    env_file:
      - ./data/secrets/lobe.env
    environment:
      APP_URL: ${APP_URL}
      INTERNAL_APP_URL: http://localhost:3210
      # Default email/password registration works without an SMTP service.
      AUTH_DISABLE_EMAIL_PASSWORD: '0'
      AUTH_EMAIL_VERIFICATION: '0'
      AUTH_ENABLE_MAGIC_LINK: '0'
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_INTERNAL_ENDPOINT: http://${CONTAINER_NAME}-rustfs:9000
      S3_BUCKET: lobe
      S3_ENABLE_PATH_STYLE: '1'
      S3_SET_ACL: '0'
      LLM_VISION_IMAGE_USE_BASE64: '1'
      SEARXNG_URL: http://${CONTAINER_NAME}-searxng:8080
      # Avoid generic aliases on the shared 1panel-network (e.g. another app's redis).
      REDIS_URL: redis://${CONTAINER_NAME}-redis:6379
      REDIS_PREFIX: lobechat
      REDIS_TLS: '0'
      ENABLE_AGENT_GATEWAY: '1'
      AGENT_GATEWAY_URL: ${AGENT_GATEWAY_URL}
      AGENT_GATEWAY_INTERNAL_URL: http://${CONTAINER_NAME}-gateway:8787
      DEVICE_GATEWAY_URL: http://${CONTAINER_NAME}-gateway:8788
      DEVICE_GATEWAY_PUBLIC_URL: ${DEVICE_GATEWAY_PUBLIC_URL}
    networks:
      - lobe-network
      - 1panel-network
    labels:
      createdBy: "Apps"

  gateway:
    # Pin the upstream-compatible gateway independently of the app release channel.
    image: ghcr.io/lobehub/lobehub-gateway:0.5.0@sha256:63647fd8f97407dafd344dd08b509ff74a033b23292cf1d451d804cb09d35759
    container_name: ${CONTAINER_NAME}-gateway
    restart: always
    ports:
      - '${PANEL_APP_PORT_API}:8787'
      - '${PANEL_APP_PORT_PROXY}:8788'
    # Contains only the shared token and public JWKS, never the private key.
    env_file:
      - ./data/secrets/gateway.env
    environment:
      LOBE_API_BASE_URL: http://${CONTAINER_NAME}:3210
    networks:
      - lobe-network
    labels:
      createdBy: "Apps"

  postgresql:
    image: paradedb/paradedb:latest-pg17
    container_name: ${CONTAINER_NAME}-postgresql
    restart: always
    command: ['postgres', '-c', 'shared_preload_libraries=pg_search,pg_cron,pg_stat_statements']
    env_file:
      - ./data/secrets/postgresql.env
    volumes:
      - './data/postgresql:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - lobe-network
    labels:
      createdBy: "Apps"

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_NAME}-redis
    restart: always
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - './data/redis:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lobe-network
    labels:
      createdBy: "Apps"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: ${CONTAINER_NAME}-rustfs
    restart: always
    ports:
      - '${PANEL_APP_PORT_S3}:9000'
      - '${PANEL_APP_PORT_ADMIN}:9001'
    env_file:
      - ./data/secrets/rustfs.env
    environment:
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_VOLUMES: /data
    volumes:
      - './data/rustfs:/data'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - lobe-network
    labels:
      createdBy: "Apps"

  # One-shot bucket/CORS provisioning: exit successfully and skip 1Panel's running-status check.
  rustfs-init:
    image: rustfs/rc:latest
    container_name: ${CONTAINER_NAME}-rustfs-init
    restart: 'no'
    depends_on:
      rustfs:
        condition: service_healthy
    env_file:
      - ./data/secrets/rustfs.env
    environment:
      APP_URL: ${APP_URL}
      RUSTFS_ENDPOINT: http://${CONTAINER_NAME}-rustfs:9000
    volumes:
      - './data/bucket.config.json:/bucket.config.json:ro'
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        rc alias set rustfs "$${RUSTFS_ENDPOINT}" "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        rc mb rustfs/lobe --ignore-existing
        rc anonymous set-json /bucket.config.json rustfs/lobe
        printf '%s' "<CORSConfiguration><CORSRule><AllowedOrigin>$${APP_URL}</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>" | rc bucket cors set rustfs/lobe -
    networks:
      - lobe-network
    labels:
      createdBy: "Apps"
      skipStatusCheck: "true"

  searxng:
    image: searxng/searxng:latest
    container_name: ${CONTAINER_NAME}-searxng
    restart: always
    env_file:
      - ./data/secrets/searxng.env
    environment:
      SEARXNG_SETTINGS_FILE: /etc/searxng/settings.yml
    volumes:
      - './data/searxng-settings.yml:/etc/searxng/settings.yml'
    networks:
      - lobe-network
    labels:
      createdBy: "Apps"

networks:
  lobe-network:
    driver: bridge
  1panel-network:
    external: true

additionalProperties:
  formFields:
    - default: 3210
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Application Port
      labelZh: 应用端口
      required: true
      rule: paramPort
      type: number
    - default: 9000
      edit: true
      envKey: PANEL_APP_PORT_S3
      labelEn: S3 API Port
      labelZh: S3 API 端口
      required: true
      rule: paramPort
      type: number
    - default: 9001
      edit: true
      envKey: PANEL_APP_PORT_ADMIN
      labelEn: RustFS Console Port
      labelZh: RustFS 管理端口（勿直接暴露公网）
      required: true
      rule: paramPort
      type: number
    - default: 8787
      edit: true
      envKey: PANEL_APP_PORT_API
      labelEn: Agent Gateway Port
      labelZh: Agent 网关端口
      required: true
      rule: paramPort
      type: number
    - default: 8788
      edit: true
      envKey: PANEL_APP_PORT_PROXY
      labelEn: Device Gateway Port
      labelZh: 设备网关端口
      required: true
      rule: paramPort
      type: number
    - default: http://Your-IP:3210
      edit: true
      envKey: APP_URL
      labelEn: Public Application URL (no trailing slash)
      labelZh: 应用外部地址（不要以 / 结尾）
      required: true
      rule: paramExtUrl
      type: text
    - default: http://Your-IP:9000
      edit: true
      envKey: S3_ENDPOINT
      labelEn: Browser-accessible S3 Endpoint
      labelZh: 浏览器可访问的 S3 地址
      required: true
      rule: paramExtUrl
      type: text
    - default: http://Your-IP:8787
      edit: true
      envKey: AGENT_GATEWAY_URL
      labelEn: Browser-accessible Agent Gateway URL
      labelZh: 浏览器可访问的 Agent 网关地址（HTTP/HTTPS）
      required: true
      rule: paramExtUrl
      type: text
    - default: http://Your-IP:8788
      edit: true
      envKey: DEVICE_GATEWAY_PUBLIC_URL
      labelEn: Public Device Gateway URL (HTTP/HTTPS)
      labelZh: 设备网关外部地址（HTTP/HTTPS）
      required: true
      rule: paramExtUrl
      type: text
    - default: ''
      edit: true
      envKey: AUTH_ALLOWED_EMAILS
      labelEn: Registration Email/Domain Allowlist (optional, comma-separated)
      labelZh: 注册邮箱或域名白名单（可选，英文逗号分隔）
      required: false
      type: text

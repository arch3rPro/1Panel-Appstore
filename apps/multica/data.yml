title: 像分配任务给同事一样把工作派给 AI Agent 的协作工作台
description: Multica 是一个自托管工作空间，把 issue 指派给 Claude Code、Codex、Copilot CLI 等 AI 编码 Agent，Agent 领任务、汇报进度、抛出阻塞再交回评审。前端 Next.js、后端 Go，需自备 PostgreSQL 与可选的 AI Agent CLI。

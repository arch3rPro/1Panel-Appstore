services:
  magpie:
    image: ghcr.io/yetone/magpie:0.1.3644
    container_name: ${CONTAINER_NAME}
    restart: always
    # 上游镜像默认以 uid 65532 运行，1Panel 创建的 ./data 目录属主为 root，
    # 非 root 用户无法写入 /config（数据会静默丢失），因此这里以 root 运行。
    user: "0:0"
    command:
      - web
      - --addr
      - 0.0.0.0:3430
      - --no-open
    ports:
      - "${PANEL_APP_PORT_HTTP}:3430"
      - "${PANEL_APP_PORT_API}:3425"
    volumes:
      - ./data:/config
    environment:
      - TZ=Asia/Shanghai
      - MAGPIE_WEB_KEY=${MAGPIE_WEB_KEY}
      - MAGPIE_PUBLIC_URL=${MAGPIE_PUBLIC_URL}
      - MAGPIE_ALLOW_IPS=${MAGPIE_ALLOW_IPS}
      - DO_NOT_TRACK=${DO_NOT_TRACK}
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true

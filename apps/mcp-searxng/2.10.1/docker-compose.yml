services:
  mcp-searxng:
    image: isokoliuk/mcp-searxng:2.10.1
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - SEARXNG_URL=${SEARXNG_URL}
      - SEARXNG_DEFAULT_RESPONSE_FORMAT=${SEARXNG_DEFAULT_RESPONSE_FORMAT:-text}
      - SEARXNG_DEFAULT_LANGUAGE=${SEARXNG_DEFAULT_LANGUAGE:-all}
      - SEARXNG_DEFAULT_SAFESEARCH=${SEARXNG_DEFAULT_SAFESEARCH:-1}
      - SEARXNG_MAX_RESULTS=${SEARXNG_MAX_RESULTS}
      - SEARXNG_HTML_FALLBACK=${SEARXNG_HTML_FALLBACK:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
additionalProperties:
  formFields:
    - default: 8080
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelZh: HTTP 服务端口
      labelEn: HTTP Service Port
      required: true
      rule: paramPort
      type: number
    - default: ""
      edit: true
      envKey: SEARXNG_URL
      labelZh: SearXNG 实例地址（必填，多个用分号分隔）
      labelEn: SearXNG Instance URL (required, semicolon-separated list allowed)
      required: true
      type: text
    - default: "text"
      edit: true
      envKey: SEARXNG_DEFAULT_RESPONSE_FORMAT
      labelZh: 搜索响应默认格式
      labelEn: Default Search Response Format
      required: false
      type: select
      values:
        - label: text
          value: "text"
        - label: json
          value: "json"
    - default: "all"
      edit: true
      envKey: SEARXNG_DEFAULT_LANGUAGE
      labelZh: 默认搜索语言（如 en、zh、all）
      labelEn: Default Search Language (e.g. en, zh, all)
      required: false
      type: text
    - default: "1"
      edit: true
      envKey: SEARXNG_DEFAULT_SAFESEARCH
      labelZh: 默认安全搜索等级（0 关闭 / 1 适中 / 2 严格）
      labelEn: Default Safe-search Level (0 off / 1 moderate / 2 strict)
      required: false
      type: select
      values:
        - label: "0（关闭）"
          value: "0"
        - label: "1（适中）"
          value: "1"
        - label: "2（严格）"
          value: "2"
    - default: ""
      edit: true
      envKey: SEARXNG_MAX_RESULTS
      labelZh: 单次返回结果上限（1-20，留空用服务端默认）
      labelEn: Max Results per Call (1-20, empty uses server default)
      required: false
      type: number
    - default: "false"
      edit: true
      envKey: SEARXNG_HTML_FALLBACK
      labelZh: 启用 HTML 回退（JSON 被拒绝时解析 HTML 页）
      labelEn: Enable HTML Fallback (parse HTML page when JSON is rejected)
      required: false
      type: select
      values:
        - label: "true"
          value: "true"
        - label: "false"
          value: "false"
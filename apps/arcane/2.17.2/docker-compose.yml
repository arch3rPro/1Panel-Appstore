services:
  arcane:
    image: ghcr.io/ofkm/arcane:v2.17.2
    container_name: ${CONTAINER_NAME}
    ports:
      - ${PANEL_APP_PORT_HTTP}:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      - APP_ENV=production
      - PUID=2000
      - PGID=2000
      - PUBLIC_SESSION_SECRET=${PUBLIC_SESSION_SECRET}
    restart: always
    labels:
      createdBy: Apps
    networks:
      - 1panel-network
networks:
  1panel-network:
    external: true
